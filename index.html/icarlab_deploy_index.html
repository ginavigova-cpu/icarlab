<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCar Lab - Dashboard Financiero y Operacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #111827; border-right: 1px solid #1f2937; }
        .card-dark { background-color: #161e2e; border: 1px solid #1f2937; border-radius: 1rem; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-64 sidebar flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 flex items-center space-x-3 border-b border-gray-800">
                <div class="bg-gradient-to-tr from-amber-500 via-orange-500 to-rose-600 p-2.5 rounded-2xl text-white shadow-lg shadow-orange-500/30">
                    <i class="fa-solid fa-car-side text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-wider text-white">iCAR <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400">- LAB</span></h1>
                    <p class="text-[10px] font-semibold tracking-widest text-orange-400 uppercase">Estética Automotriz</p>
                </div>
            </div>
            <div class="px-4 py-6">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4 px-2">Módulos Principales</p>
                <nav class="space-y-2">
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gradient-to-r from-orange-600 to-amber-600 text-white font-medium shadow-lg shadow-orange-600/20">
                        <i class="fa-solid fa-chart-pie"></i><span>Dashboard & Reportes</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition">
                        <i class="fa-solid fa-file-invoice-dollar"></i><span>Unidades & Cotizaciones</span>
                    </a>
                </nav>
            </div>
        </div>
    </aside>
    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-8">
        <h2 class="text-2xl font-bold text-white">Resumen General iCar Lab</h2>
        <p class="text-sm text-gray-400 mt-2">Dashboard operativo activo en Querétaro QRO.</p>
    </main>
</body>
</html>
